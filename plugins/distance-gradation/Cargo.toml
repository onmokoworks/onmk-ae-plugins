[package]
name = "distance-gradation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "onmk DistanceGradation: antialiased distance gradients over the original layer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
after-effects = { git = "https://github.com/virtualritz/after-effects.git", rev = "0e0b197850f28c1bb24e8c82fce2e3d4c120d1e9" }

[build-dependencies]
pipl = { git = "https://github.com/virtualritz/after-effects.git", rev = "0e0b197850f28c1bb24e8c82fce2e3d4c120d1e9" }
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "thin"
