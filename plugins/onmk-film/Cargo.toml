[workspace]
resolver = "2"
members = [
    "crates/onmk-film-core",
    "crates/onmk-film-gpu",
    "crates/onmk-film-ae",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
wgpu = "26"
pollster = "0.4"
parking_lot = "0.12"

# Development bundles are installed into AE directly. Keep symbols, but avoid
# an unoptimized full-frame renderer that can look like a host hang.
[profile.dev]
opt-level = 2
debug = 1
