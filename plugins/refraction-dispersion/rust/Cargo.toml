[package]
name = "refraction-dispersion"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
after-effects = { git = "https://github.com/virtualritz/after-effects.git" }
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "26"
pollster = "0.4"
futures-intrusive = "0.5"
parking_lot = "0.12"
num_cpus = "1.17"

[profile.release]
lto = "thin"
codegen-units = 1

[build-dependencies]
pipl = { git = "https://github.com/virtualritz/after-effects.git" }
