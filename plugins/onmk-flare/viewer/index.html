<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>onmkFlare Studio</title><style>
:root{--bg:#090b10;--panel:#11141b;--panel2:#171b24;--line:#292f3d;--text:#dbe2ef;--muted:#778297;--accent:#5aa7ff;--orange:#ff914d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px Inter,Segoe UI,sans-serif;overflow:hidden}button,select,input{font:inherit}.top{height:46px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:#0d1016;gap:10px}.brand{font-weight:750;font-size:15px;letter-spacing:.5px}.brand i{color:var(--accent);font-style:normal}.top .spacer{flex:1}.btn{color:var(--text);background:#1b202a;border:1px solid #343c4b;border-radius:4px;padding:6px 11px;cursor:pointer}.btn:hover{background:#252c38}.btn.primary{background:#1769aa;border-color:#3089cf}.layout{height:calc(100vh - 70px);display:grid;grid-template-columns:230px 1fr 270px}.pane{background:var(--panel);border-right:1px solid var(--line);overflow:auto}.right{border-right:0;border-left:1px solid var(--line)}.section-title{height:34px;padding:10px 12px 7px;color:#93a0b5;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:1.4px;border-bottom:1px solid #232935}.search{margin:10px;width:calc(100% - 20px);background:#0b0e13;border:1px solid var(--line);border-radius:4px;color:white;padding:7px}.preset{padding:9px 12px;border-bottom:1px solid #1d222d;cursor:pointer;display:flex;align-items:center;gap:9px}.preset:hover{background:#191e27}.preset.active{background:#17273a;border-left:3px solid var(--accent);padding-left:9px}.thumb{width:38px;height:25px;border-radius:3px;background:radial-gradient(circle at 35% 45%,#fff 0 2%,#87c8ff 3%,#163a67 14%,transparent 38%),linear-gradient(130deg,#10131a,#050609)}.preset small{display:block;color:var(--muted);margin-top:2px}.stage{position:relative;background:radial-gradient(circle at 50% 45%,#111725,#050609 65%);overflow:hidden}.stage canvas{width:100%;height:100%;display:block}.stagebar{position:absolute;left:12px;right:12px;bottom:12px;height:35px;background:#0d1119dd;border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;padding:0 10px;gap:12px}.stagebar span{color:var(--muted)}.layers{position:absolute;top:12px;left:12px;width:178px;background:#0d1119dc;border:1px solid var(--line);border-radius:5px;overflow:hidden;backdrop-filter:blur(8px)}.layer{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid #222936;cursor:pointer}.layer.active{background:#1b2c41}.eye{width:9px;height:9px;border-radius:50%;background:#55aaff;box-shadow:0 0 7px #55aaff}.eye.off{background:#3a404b;box-shadow:none}.prop{padding:10px 12px;border-bottom:1px solid #202632}.prop label{display:flex;justify-content:space-between;color:#aeb8c9;margin-bottom:6px}.prop output{color:#fff}.prop input[type=range]{width:100%;accent-color:var(--accent)}.prop select{width:100%;background:#0d1118;color:var(--text);border:1px solid var(--line);padding:6px;border-radius:3px}.swatches{display:flex;gap:6px}.swatch{width:25px;height:20px;border:1px solid #50596b;border-radius:3px;cursor:pointer}.status{height:24px;border-top:1px solid var(--line);background:#0d1016;color:#667287;padding:5px 12px;display:flex;justify-content:space-between}.badge{padding:2px 5px;border-radius:3px;background:#14385a;color:#8bc7ff;font-size:9px}.hint{color:#657186;padding:10px 12px;line-height:1.5}
</style></head><body>
<div class="top"><div class="brand">onmk<i>Flare</i> Studio</div><span class="badge">LIVE</span><button class="btn" id="newBtn">New</button><button class="btn" id="loadBtn">Load JSON</button><button class="btn" id="saveBtn">Save Preset</button><div class="spacer"></div><button class="btn" id="randomBtn">Randomize</button><button class="btn primary" id="copyBtn">Copy Settings</button><input id="file" type="file" accept=".json" hidden></div>
<div class="layout"><aside class="pane"><div class="section-title">Preset Browser</div><input class="search" id="search" placeholder="Search presets..."><div id="presets"></div></aside>
<main class="stage"><canvas id="canvas"></canvas><div class="layers" id="layers"><div class="section-title">Elements</div></div><div class="stagebar"><span>Preview</span><select id="bg"><option>Black</option><option>Dark Gray</option><option>Checker</option></select><span>Drag the light source</span><div class="spacer"></div><span id="fps">60 FPS</span></div></main>
<aside class="pane right"><div class="section-title">Element Controls</div><div id="controls"></div><div class="hint">保存したJSONはルックの設計データです。AE側では同名の内蔵Look Presetを選ぶか、各値を調整してください。</div></aside></div><div class="status"><span>Double precision optical layout • 650 / 550 / 450 nm</span><span id="status">Ready</span></div>
<script>
const defaults={name:'Golden Cinema',lens:2,brightness:1.12,scale:1,lightX:.34,lightY:.38,hotspot:1.25,glow:1.2,glowRadius:.21,streak:.32,stripe:.18,ring:.62,ghost:1.25,bloom:2.8,chromatic:.35,starburst:.12,blades:7,ocular:.42};
const looks=[
['Natural','Neutral physical response',{lens:1,glow:.72,stripe:.08,ring:.08,ghost:.9,bloom:2,chromatic:.24,ocular:.14}],['Cinematic','Unified warm optical character',{lens:2,glow:1.2,streak:.2,stripe:.12,ring:.1,ghost:1.25,bloom:2.8,chromatic:.35,ocular:.32}],['Anamorphic','Unified blue horizontal character',{lens:1,glow:.8,streak:.14,stripe:.72,ring:.06,ghost:1,bloom:2.2,chromatic:.7,ocular:.2}],['Vintage','Soft Cooke response',{lens:0,glow:1.35,streak:.18,stripe:.08,ring:.08,ghost:1.45,bloom:3.2,chromatic:.22,ocular:.3}],['Dream','Diffused unified response',{lens:1,glow:1.8,glowRadius:.27,streak:.1,stripe:.06,ring:.04,ghost:.72,bloom:4.2,chromatic:.4,ocular:.45}],['Legacy / Custom','Previous balanced editor state',{}],['Legacy / Anamorphic Blue','Previous wide blue cinema streak',{lens:1,glow:.72,streak:.45,stripe:1.65,ring:.22,ghost:.8,bloom:1.8,chromatic:.72}],['Legacy / Golden Cinema','Previous warm ARRI reflections',{lens:2,glow:1.2,streak:.32,stripe:.18,ring:.62,ghost:1.25,bloom:2.8,chromatic:.35}],['Legacy / Sci-Fi Prism','Previous spectral ring look',{lens:3,brightness:1.25,glow:.8,ring:1.15,ghost:1.35,bloom:2.1,chromatic:1,starburst:.8}],['Legacy / Vintage 35mm','Previous amber Cooke look',{lens:0,brightness:.92,glow:1.35,ring:.35,ghost:1.7,bloom:3.2,chromatic:.25}],['Legacy / Dream Bloom','Previous pink diffusion look',{glow:1.8,glowRadius:.27,streak:.16,stripe:.12,ring:.18,ghost:.58,bloom:4.2,chromatic:.4}],['Legacy / Ocular Night','Previous eye-corona look',{glow:1.1,streak:.75,stripe:.3,ring:.42,ghost:.4,bloom:2,ocular:1}],['Legacy / Solar Blast','Previous large star flare',{lens:2,brightness:1.65,hotspot:2.4,glow:1.65,glowRadius:.34,streak:1.1,ring:.8,ghost:1.25,bloom:3.6,starburst:1.45,blades:12}]];
const elements=[['hotspot','Hotspot'],['glow','Glow'],['streak','Streaks'],['stripe','Anamorphic Stripe'],['ring','Spectral Ring'],['ghost','Optical Ghosts'],['bloom','Bloom'],['starburst','Starburst'],['ocular','Ocular Diffraction']];
let s={...defaults},selected='ghost',enabled=Object.fromEntries(elements.map(e=>[e[0],true]));const cvs=document.querySelector('#canvas'),ctx=cvs.getContext('2d');
function presetList(q=''){presets.innerHTML='';looks.forEach((p,i)=>{if(!(p[0]+' '+p[1]).toLowerCase().includes(q.toLowerCase()))return;let d=document.createElement('div');d.className='preset'+(s.name===p[0]?' active':'');d.innerHTML=`<div class=thumb></div><div>${p[0]}<small>${p[1]}</small></div>`;d.onclick=()=>{s={...defaults,...p[2],name:p[0]};presetList(search.value);buildControls();draw()};presets.appendChild(d)})}
function layerList(){layers.querySelectorAll('.layer').forEach(x=>x.remove());elements.forEach(e=>{let d=document.createElement('div');d.className='layer'+(selected===e[0]?' active':'');d.innerHTML=`<i class="eye ${enabled[e[0]]?'':'off'}"></i><span>${e[1]}</span>`;d.onclick=x=>{if(x.target.classList.contains('eye'))enabled[e[0]]=!enabled[e[0]];else selected=e[0];layerList();buildControls();draw()};layers.appendChild(d)})}
const defs={hotspot:[['hotspot','Intensity',0,3,.01]],glow:[['glow','Intensity',0,3,.01],['glowRadius','Radius',.03,.5,.01]],streak:[['streak','Intensity',0,2,.01]],stripe:[['stripe','Intensity',0,3,.01]],ring:[['ring','Intensity',0,2,.01],['chromatic','Chromatic',0,1,.01]],ghost:[['ghost','Intensity',0,3,.01],['lens','Lens model',0,3,1]],bloom:[['bloom','Strength',0,6,.05]],starburst:[['starburst','Intensity',0,2,.01],['blades','Blades',3,16,1]],ocular:[['ocular','Intensity',0,2,.01]]};
function buildControls(){controls.innerHTML='';let title=document.createElement('div');title.className='section-title';title.textContent=elements.find(e=>e[0]===selected)[1];controls.appendChild(title);(defs[selected]||[]).forEach(d=>{let p=document.createElement('div');p.className='prop';p.innerHTML=`<label><span>${d[1]}</span><output>${s[d[0]]}</output></label><input type=range min=${d[2]} max=${d[3]} step=${d[4]} value=${s[d[0]]}>`;let r=p.querySelector('input'),o=p.querySelector('output');r.oninput=()=>{s[d[0]]=+r.value;o.textContent=r.value;draw()};controls.appendChild(p)});let base=document.createElement('div');base.innerHTML=`<div class=section-title>Global</div>`;controls.appendChild(base);[['brightness','Brightness',.1,3,.01],['scale','Scale',.4,2,.01]].forEach(d=>{let p=document.createElement('div');p.className='prop';p.innerHTML=`<label><span>${d[1]}</span><output>${s[d[0]]}</output></label><input type=range min=${d[2]} max=${d[3]} step=${d[4]} value=${s[d[0]]}>`;p.querySelector('input').oninput=e=>{s[d[0]]=+e.target.value;p.querySelector('output').textContent=e.target.value;draw()};controls.appendChild(p)})}
function resize(){let r=cvs.getBoundingClientRect(),d=devicePixelRatio;cvs.width=r.width*d;cvs.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function draw(){let w=cvs.clientWidth,h=cvs.clientHeight,x=s.lightX*w,y=s.lightY*h,sc=s.scale,add=(x,y,r,c,a=1)=>{let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c.replace('A',a));g.addColorStop(.18,c.replace('A',a*.55));g.addColorStop(1,c.replace('A','0'));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)};ctx.clearRect(0,0,w,h);ctx.fillStyle=bg.value==='Dark Gray'?'#17191d':'#030407';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='lighter';if(enabled.glow)add(x,y,Math.min(w,h)*s.glowRadius*sc,'rgba(255,145,72,A)',s.glow*.34*s.brightness);if(enabled.hotspot)add(x,y,25*sc,'rgba(255,248,225,A)',s.hotspot*s.brightness);if(enabled.stripe){let g=ctx.createLinearGradient(0,y,w,y);g.addColorStop(0,'transparent');g.addColorStop(s.lightX,'rgba(110,175,255,'+Math.min(1,s.stripe*.45)+')');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,y-1.4*sc,w,2.8*sc)}if(enabled.streak){ctx.save();ctx.translate(x,y);for(let i=0;i<24;i++){let a=i*Math.PI/12+.13*Math.sin(i*19),weight=.18+.82*Math.pow(.5+.5*Math.sin(i*7.173+1.7),2),len=(48+210*weight)*sc;ctx.strokeStyle=`rgba(255,210,155,${Math.min(1,s.streak*.32*weight)})`;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(Math.cos(a+.025)*len*.45,Math.sin(a+.025)*len*.45,Math.cos(a)*len,Math.sin(a)*len);ctx.stroke()}ctx.restore()}let cx=w/2,cy=h/2,dx=cx-x,dy=cy-y;if(enabled.ghost)for(let i=0;i<18;i++){let t=.18+i*.078,xx=x+dx*t*2,yy=y+dy*t*2,r=(4+(i%5)*4)*sc*(s.lens===3?1.4:1),j=Math.sin(i*31.7)*7;let hues=[['255,80,40','30,210,255'],['40,120,255','255,80,30'],['255,155,40','80,255,180'],['70,255,120','180,60,255']][s.lens];add(xx,yy+j,r,`rgba(${hues[i%2]},A)`,s.ghost*.11)}if(enabled.ring){ctx.lineWidth=2.2;for(let i=0;i<7;i++){let a0=i*.92+.17,a1=a0+.34+.32*(.5+.5*Math.sin(i*4.2));ctx.strokeStyle=`rgba(255,175,95,${Math.min(1,s.ring*(.12+.18*(i%3)))})`;ctx.beginPath();ctx.arc(x,y,88*sc,a0,a1);ctx.stroke()}}if(enabled.bloom)add(x,y,Math.min(w,h)*.38*sc,'rgba(255,110,40,A)',s.bloom*.045);if(enabled.starburst){ctx.save();ctx.translate(x,y);for(let i=0;i<s.blades;i++){let a=i*Math.PI*2/s.blades+.035*Math.sin(i*11),weight=.25+.75*Math.pow(.5+.5*Math.sin(i*5.73),2),len=220*weight*sc;ctx.strokeStyle=`rgba(255,225,180,${Math.min(1,s.starburst*.42*weight)})`;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(Math.cos(a+.03)*len*.5,Math.sin(a+.03)*len*.5,Math.cos(a)*len,Math.sin(a)*len);ctx.stroke()}ctx.restore()}if(enabled.ocular&&s.ocular>0){ctx.strokeStyle=`rgba(255,210,130,${s.ocular*.22})`;for(let i=0;i<90;i++){let a=i*2.399,r=25+120*((i*37)%97)/97;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*8,y+Math.sin(a)*8);ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);ctx.stroke()}}ctx.globalCompositeOperation='source-over';ctx.strokeStyle='#75baff';ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.stroke();status.textContent=s.name+' • '+['Cooke Triplet','Double Gauss','ARRI Master Prime','Canon EF 200-400'][s.lens]}
cvs.onpointerdown=e=>{let move=q=>{let r=cvs.getBoundingClientRect();s.lightX=Math.max(0,Math.min(1,(q.clientX-r.left)/r.width));s.lightY=Math.max(0,Math.min(1,(q.clientY-r.top)/r.height));draw()};move(e);cvs.onpointermove=move;cvs.setPointerCapture(e.pointerId)};cvs.onpointerup=()=>cvs.onpointermove=null;
search.oninput=e=>presetList(e.target.value);newBtn.onclick=()=>{s={...defaults};buildControls();draw()};randomBtn.onclick=()=>{for(let k of ['glow','streak','stripe','ring','ghost','bloom','starburst'])s[k]=Math.random()*1.8;s.lens=Math.floor(Math.random()*4);buildControls();draw()};saveBtn.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,settings:s,elements:enabled},null,2)],{type:'application/json'}));a.download=(s.name||'onmkFlare')+'.onmkflare.json';a.click()};loadBtn.onclick=()=>file.click();file.onchange=async()=>{let j=JSON.parse(await file.files[0].text());s={...defaults,...j.settings};enabled={...enabled,...j.elements};presetList();layerList();buildControls();draw()};copyBtn.onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(s,null,2));status.textContent='Settings copied to clipboard'};bg.onchange=draw;window.onresize=resize;presetList();layerList();buildControls();resize();
</script></body></html>
